
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = -v --strict-markers

markers =
    unit: testes unitarios
    integration: testes de integracao com MySQL
    api: testes dos endpoints FastAPI
    auth: testes de autenticacao e autorizacao
