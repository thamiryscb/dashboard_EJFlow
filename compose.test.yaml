services:
  db-test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_test
      MYSQL_DATABASE: ejflow_test
      MYSQL_USER: ejflow_test
      MYSQL_PASSWORD: ejflow_test
    ports:
      - "127.0.0.1:3307:3306"
    tmpfs:
      - /var/lib/mysql
    volumes:
      - ./sql/init_mock_data.sql:/docker-entrypoint-initdb.d/01_init_mock_data.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP -h 127.0.0.1
          -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE"
          -e 'SELECT 1 FROM tarefas LIMIT 1'
      interval: 5s
      timeout: 5s
      retries: 30